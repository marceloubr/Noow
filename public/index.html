<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Entregador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>App do Entregador</h1>
            <nav>
                <button data-screen="deliveries">Entregas</button>
                <button data-screen="map">Mapa</button>
                <button data-screen="history">Histórico</button>
                <button data-screen="earnings">Ganhos</button>
                <button data-screen="profile">Perfil</button>
                <button id="logout-btn">Sair</button>
            </nav>
        </header>
        <main>
            <section id="deliveries-screen" class="screen">
                <h2>Entregas Disponíveis</h2>
                <div id="deliveries-list"></div>
            </section>
            <section id="map-screen" class="screen hidden">
                <h2>Mapa da Entrega</h2>
                <div id="map"></div>
            </section>
            <section id="history-screen" class="screen hidden">
                <h2>Histórico de Entregas</h2>
                <div id="history-list"></div>
            </section>
            <section id="earnings-screen" class="screen hidden">
                <h2>Meus Ganhos</h2>
                <div id="earnings-info"></div>
            </section>
            <section id="profile-screen" class="screen hidden">
                <h2>Meu Perfil</h2>
                <div id="profile-info"></div>
                <form id="doc-upload-form">
                    <input type="file" id="doc-file" required>
                    <select id="doc-type" required>
                        <option value="RG">RG</option>
                        <option value="CNH">CNH</option>
                        <option value="Bank">Dados Bancários</option>
                    </select>
                    <button type="submit">Enviar Documento</button>
                </form>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
